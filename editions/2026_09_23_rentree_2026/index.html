<style>
/* =========================================================================
   NEWSLETTER DE L'ÉQUIPE — gabarit
   Charte rétrofuturisme simplifiée (skill retrofuturisme_site) :
   palette et typographie de la charte, ornements réduits à l'essentiel.
   Tout le contenu d'une édition vit dans l'objet EDITION, en bas de fichier.
   ========================================================================= */

:root {
  /* Palette de la charte */
  --teal:        #127676;
  --teal-clair:  #2FA3A3;
  --orange:      #E4632E;
  --jaune:       #E3A535;
  --ink:         #0D1617;
  --paper:       #F2EFE6;
  --teal-sombre: #0B4E4E;

  /* Asymétrie : le fond de page est le cran 1, les cartes prennent le cran 2 */
  --r-carte:    8px 24px 8px 24px;
  --r-carte-sm: 12px 4px 12px 4px;

  /* Rythme vertical */
  --gouttiere: clamp(1.1rem, 5vw, 2rem);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: var(--ink);
  /* Motif Horta en SVG inline : remplace le fond Art Nouveau en .jpg de la
     charte. Aucune requête, et le poids reste tenable sur un smartphone. */
  background-image:
    radial-gradient(ellipse 120% 70% at 50% 0%, rgba(18,118,118,0.30), transparent 60%),
    url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160' viewBox='0 0 160 160'%3E%3Cg fill='none' stroke='%23127676' stroke-width='1.1' opacity='0.22'%3E%3Cpath d='M0,80 Q40,40 80,80 T160,80'/%3E%3Cpath d='M80,0 Q120,40 80,80 T80,160'/%3E%3Ccircle cx='80' cy='80' r='5'/%3E%3Ccircle cx='0' cy='80' r='3'/%3E%3Ccircle cx='160' cy='80' r='3'/%3E%3C/g%3E%3C/svg%3E");
  background-attachment: fixed, fixed;
  color: var(--paper);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.65;
}

/* Les éléments graphiques entrant par un côté commencent hors cadre, ce qui
   étend la surface de débordement. La coupe doit être portée par la racine :
   posée sur `body`, le navigateur ne l'applique pas au viewport et la page
   glisse de côté sous le doigt. `hidden` interdit le défilement à
   l'utilisateur mais pas le défilement programmatique ; `clip` interdit les
   deux, et sert de repli aux navigateurs qui ne le connaissent pas. */
html {
  overflow-x: hidden;
  overflow-x: clip;
}

.nl {
  max-width: 680px;
  margin: 0 auto;
  padding: 0 var(--gouttiere) 0;
}

/* ---------- Bloc d'ouverture -------------------------------------------- */

.ouverture {
  position: relative;
  text-align: center;
  padding: clamp(3rem, 14vw, 5.5rem) clamp(1rem, 5vw, 2rem) clamp(2.5rem, 9vw, 4rem);
}

/* Médaillon du bloc d'ouverture : le logo TICE, commun à toutes les éditions,
   posé sur un support crème. Son mot est noir et n'a plus son liseré blanc,
   donc sur le fond sombre du gabarit il disparaîtrait ; le crème le rend
   lisible. Le support est carré à coins asymétriques, comme les cartes
   d'éléments : un cercle rognerait le mot, qui déborde du disque du dessin. */
.ouverture-logo {
  display: block;
  width: clamp(96px, 26vw, 118px);
  height: auto;
  margin: 0 auto 1.4rem;
  padding: 9px;
  background: var(--paper);
  border: 3px solid var(--teal);
  border-radius: var(--r-carte-sm);
  box-shadow: inset 0 0 0 2px var(--orange);
}

.ouverture-numero {
  display: inline-block;
  font-family: 'Oswald', 'Inter', sans-serif;
  font-weight: 500;
  font-size: 0.8rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--jaune);
  border-radius: 50px;
  padding: 7px 17px;
  margin-bottom: 1.4rem;
}

.ouverture-titre {
  font-family: 'Anton', 'Oswald', Impact, sans-serif;
  font-weight: 400;
  /* 12vw rognait le titre sur un écran de 412 px : « LE JOURNAL DES » dépassait
     la colonne et le débordement était coupé par le clip de la racine, donc
     invisible au contrôle de scrollWidth. */
  font-size: clamp(1.9rem, 9vw, 3.4rem);
  line-height: 1.02;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--paper);
  margin: 0 0 1.2rem;
}

.ouverture-accroche {
  font-size: clamp(1.02rem, 4.4vw, 1.2rem);
  color: rgba(242, 239, 230, 0.82);
  margin: 0 auto;
  max-width: 34ch;
}

/* Ornement de coin, variante A (feuille simple) : bloc d'ouverture seulement */
.ornement {
  position: absolute;
  width: clamp(40px, 13vw, 58px);
  height: auto;
  color: var(--teal-clair);
  opacity: 0.55;
  pointer-events: none;
}
.ornement.haut-gauche { top: 10px; left: 0; }
/* Miroir par la propriété `scale`, pas par `transform` : la révélation écrit
   dans `transform` pour faire entrer l'ornement par le côté, et les deux se
   seraient écrasés. */
.ornement.bas-droit   { bottom: 4px; right: 0; scale: -1; }

/* Séparateur végétal */
.separateur {
  display: flex;
  margin: 0 0 1.6rem;
  align-items: center;
  gap: 14px;
  color: var(--teal-clair);
  font-size: 1.15rem;
}
.separateur::before,
.separateur::after {
  content: '';
  flex: 1;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--teal) 25%, var(--teal) 75%, transparent);
}

/* ---------- Rubriques ---------------------------------------------------- */

.rubrique { margin: clamp(2.6rem, 11vw, 4.2rem) 0; }

.rubrique-entete {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  margin-bottom: 1.4rem;
}

.rubrique-icone {
  flex: none;
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border: 2px solid var(--teal-clair);
  border-radius: 50%;
  background: rgba(18, 118, 118, 0.22);
  color: var(--jaune);
  font-size: 1.35rem;       /* taille du fallback emoji */
  line-height: 1;
  overflow: hidden;
}
.rubrique-icone img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rubrique-icone svg { width: 26px; height: 26px; }

.rubrique-titre {
  font-family: 'Oswald', 'Inter', sans-serif;
  font-weight: 700;
  font-size: clamp(1.25rem, 5.6vw, 1.6rem);
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--jaune);
  margin: 0;
}

/* Image d'illustration de la rubrique entière */
.rubrique-image {
  width: 100%;
  border: 2px solid var(--teal);
  border-radius: var(--r-carte);
  overflow: hidden;
  margin-bottom: 1.3rem;
  display: block;
}
.rubrique-image img { width: 100%; height: auto; display: block; }

/* ---------- Éléments ----------------------------------------------------- */

.element {
  background: var(--paper);
  color: var(--ink);
  border: 3px solid var(--teal);
  border-radius: var(--r-carte);
  box-shadow: inset 0 0 0 2px var(--orange);
  padding: clamp(1rem, 4.5vw, 1.4rem);
  margin-bottom: 1.1rem;
}
.element:last-child { margin-bottom: 0; }

.element-image {
  border: 2px solid var(--teal-sombre);
  border-radius: var(--r-carte-sm);
  overflow: hidden;
  margin-bottom: 0.9rem;
}
.element-image img { width: 100%; height: auto; display: block; }

.element-texte { margin: 0; }

.element-lien {
  display: inline-block;
  margin-top: 0.7rem;
  font-family: 'Oswald', 'Inter', sans-serif;
  font-weight: 500;
  font-size: 0.92rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--teal-sombre);
  text-decoration: none;
  box-shadow: inset 0 -2px 0 var(--orange);
  padding: 11px 2px;         /* zone tactile confortable */
  min-height: 44px;
}
.element-lien:hover,
.element-lien:focus-visible { color: var(--orange); }
.element-lien:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.element-lien::after { content: ' ↗'; }

/* ---------- Pied de page ------------------------------------------------- */

.pied {
  text-align: center;
  /* Le creux du bas réserve la place du bouton flottant : sans lui, sur un
     écran étroit, le coin du lien passe sous la zone tactile du bouton. */
  padding: clamp(2.5rem, 10vw, 4rem) 0 clamp(6.5rem, 20vw, 8rem);
}

.pied-lien {
  display: inline-block;
  font-family: 'Oswald', 'Inter', sans-serif;
  font-weight: 500;
  font-size: 0.95rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--jaune);
  text-decoration: none;
  border: 2px solid var(--jaune);
  border-radius: 14px 5px 14px 5px;
  padding: 13px 22px;
  min-height: 44px;
}
.pied-lien:hover,
.pied-lien:focus-visible { background: var(--jaune); color: var(--ink); }
.pied-lien:focus-visible { outline: 3px solid var(--jaune); outline-offset: 3px; }

/* ---------- Bouton retour en haut ---------------------------------------- */

.retour-haut {
  position: fixed;
  right: clamp(0.9rem, 4vw, 1.6rem);
  bottom: clamp(0.9rem, 4vw, 1.6rem);
  z-index: 50;
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  border: 2px solid var(--teal);
  border-radius: 5px 14px 5px 14px;
  background: var(--jaune);
  color: var(--ink);
  font-size: 1.3rem;
  line-height: 1;
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--ink);
  opacity: 0;                /* piloté au scroll par le script */
  /* Inerte et hors du parcours clavier tant que le scroll ne l'a pas révélé :
     opacity seule laissait une tabulation s'arrêter sur un bouton invisible. */
  pointer-events: none;
  visibility: hidden;
  transition: transform .14s ease, box-shadow .14s ease;
}
.retour-haut.actif { pointer-events: auto; visibility: visible; }
.retour-haut:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
.retour-haut:focus-visible { outline: 3px solid var(--jaune); outline-offset: 3px; }

/* ---------- Scrollytelling ----------------------------------------------- */

/* --tx et --ty sont posés par le script selon la famille du bloc : les textes
   montent depuis le bas, les éléments graphiques entrent par un côté, en
   alternance droite/gauche (docs/BRAINSTORMING.md). */
.reveler {
  opacity: 0;
  transform: translate(var(--tx, 0px), var(--ty, 40px));
  transition:
    opacity var(--dur, 0.8s) cubic-bezier(0.22, 0.75, 0.3, 1) var(--retard, 0s),
    transform var(--dur, 0.8s) cubic-bezier(0.22, 0.75, 0.3, 1) var(--retard, 0s);
  will-change: opacity, transform;
}
.reveler.vu {
  opacity: 1;
  transform: translateY(0);
}

@media (prefers-reduced-motion: reduce) {
  .reveler {
    opacity: 1;
    transform: none;
    transition: none;
    will-change: auto;
  }
  .retour-haut { transition: none; }
}
</style>

</head>

/* =========================================================================

        edition   : { titre, numero, accroche }

/* =========================================================================
   2. MOTEUR — commun à toutes les éditions, ne se touche pas au numéro.

/* Emoji de repli, par type de rubrique connu. */
const EMOJI_PAR_TYPE = {
  actualites: "📰",
  mise_en_avant: "🌟",
  agenda: "📅",
  outil: "🧰",
  rappel: "📌"
};
const EMOJI_DEFAUT = "❖";

function esc(texte) {
  return String(texte).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

/* Trois profils de vitesse, distribués en boucle dans chaque famille.
   Deux blocs voisins n'ont jamais le même : c'est ce qui se voit à l'écran. */
const PROFILS = [
  { dy: 56, dur: 1.05, retard: 0 },
  { dy: 28, dur: 0.6,  retard: 0.06 },
  { dy: 42, dur: 0.85, retard: 0.03 }
];

/* Hauteur d'écran à laquelle un bloc se révèle, comptée depuis le haut : à
   0.72, il faut l'avoir remonté de plus d'un quart d'écran, si bien que
   l'animation se joue en pleine page et non dans le dernier centimètre du bas.
   Monter vers 1 déclenche plus tôt, descendre vers 0 exige plus de défilement. */
const SEUIL_REVELATION = 0.72;

/* Course latérale des éléments graphiques, en pixels. */
const ECART_LATERAL = 64;

/* Deux séries de blocs graphiques, chacune alternant droite/gauche à partir de
   la gauche, plus une série verticale pour les textes. Les ornements et
   séparateurs sont dans une série à part des icônes et images : c'est ce qui
   fait entrer chaque ornement de son propre côté, vers l'intérieur. */
const FAMILLES = [
  { selecteur: ".ornement, .separateur",                          lateral: true  },
  /* L'image glisse à l'intérieur de son cadre, qui la rogne : la translation
     porte donc sur l'image, pas sur le cadre, sinon elle déborde de la carte. */
  { selecteur: ".ouverture-logo, .rubrique-icone, .rubrique-image img, .element-image img", lateral: true  },
  { selecteur: ".rubrique-titre, .rubrique-image, .element-image, .element, .pied-lien", lateral: false }
];

function marquer(el, index, lateral) {
  const p = PROFILS[index % PROFILS.length];
  el.classList.add("reveler");
  el.style.setProperty("--dur", p.dur + "s");
  el.style.setProperty("--retard", p.retard + "s");
  if (lateral) {
    const sens = index % 2 === 0 ? -1 : 1;   /* 0 : par la gauche, 1 : par la droite */
    el.style.setProperty("--tx", (sens * ECART_LATERAL) + "px");
    el.style.setProperty("--ty", "0px");
  } else {
    el.style.setProperty("--tx", "0px");
    el.style.setProperty("--ty", p.dy + "px");
  }
}

function htmlIcone(rubrique) {
  const ic = rubrique.icone;
  if (!ic) {
    return esc(EMOJI_PAR_TYPE[rubrique.type] || EMOJI_DEFAUT);
  }
  if (ic.startsWith("#")) {
    return `<svg aria-hidden="true"><use href="${esc(ic)}"></use></svg>`;
  }
  return `<img src="${esc(ic)}" alt="">`;
}

function htmlElement(element) {
  const image = element.image
    ? `<div class="element-image"><img src="${esc(element.image)}" alt=""></div>`
    : "";
  const lien = element.lien
    ? `<a class="element-lien" href="${esc(element.lien)}" target="_blank" rel="noopener">En savoir plus</a>`
    : "";
  return `<article class="element">${image}<p class="element-texte">${esc(element.texte)}</p>${lien}</article>`;
}

function rendre(donnees) {
  document.getElementById("ed-numero").textContent = donnees.edition.numero;
  document.getElementById("ed-titre").textContent = donnees.edition.titre;
  document.getElementById("ed-accroche").textContent = donnees.edition.accroche;
  document.getElementById("lien-archive").href = LIEN_ARCHIVE;

  const hote = document.getElementById("rubriques");
  hote.innerHTML = donnees.rubriques.map(rubrique => {
    const imageRubrique = rubrique.image_rubrique
      ? `<div class="rubrique-image"><img src="${esc(rubrique.image_rubrique)}" alt=""></div>`
      : "";
    return `
      <section class="rubrique" data-type="${esc(rubrique.type)}">
        <div class="rubrique-entete">
          <span class="rubrique-icone" aria-hidden="true">${htmlIcone(rubrique)}</span>
          <h2 class="rubrique-titre">${esc(rubrique.titre)}</h2>
        </div>
        ${imageRubrique}
        ${rubrique.elements.map(htmlElement).join("")}
      </section>`;
  }).join("");
}

/* Un bloc se révèle une fois remonté au-dessus de SEUIL_REVELATION, et se
   réarme dès qu'il est sorti entièrement de l'écran : l'animation reprend donc
   à chaque remontée. Le réarmement se produisant hors de l'écran, il ne se voit
   pas. La seconde clause couvre la butée basse, où un bloc coincé sous le seuil
   ne le franchirait jamais, la page ne défilant plus. */
function doitEtreVu(el) {
  const r = el.getBoundingClientRect();
  if (r.bottom <= -2 || r.top >= window.innerHeight + 2) return false;
  if (r.top < window.innerHeight * SEUIL_REVELATION) return true;
  return window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
}

function animer() {
  const blocs = [];
  FAMILLES.forEach(famille => {
    document.querySelectorAll(famille.selecteur).forEach((el, index) => {
      marquer(el, index, famille.lateral);
      blocs.push(el);
    });
  });

  /* Mouvement réduit : tout est visible d'emblée, aucune animation à mener. */
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    blocs.forEach(b => b.classList.add("vu"));
    return;
  }

  if (!("IntersectionObserver" in window)) {
    blocs.forEach(b => b.classList.add("vu"));
    return;
  }

  function evaluer() {
    blocs.forEach(el => el.classList.toggle("vu", doitEtreVu(el)));
  }

  /* L'observateur se déclenche aux deux franchissements qui nous intéressent,
     l'entrée et la sortie ; la passe au fil du scroll rattrape ce qu'il aurait
     manqué, un saut de défilement ou une page trop courte pour défiler. */
  const observateur = new IntersectionObserver(evaluer, {
    threshold: 0,
    rootMargin: "0px 0px -28% 0px"
  });
  blocs.forEach(b => observateur.observe(b));

  let enAttente = false;
  window.addEventListener("scroll", () => {
    if (enAttente) return;
    enAttente = true;
    requestAnimationFrame(() => { evaluer(); enAttente = false; });
  }, { passive: true });

  evaluer();
}

/* Le bouton gagne en opacité avec la distance parcourue, pas avec la
   proportion lue : une édition courte peut ne jamais l'atteindre pleinement,
   et c'est le comportement voulu (docs/BRAINSTORMING.md). */
function bouton() {
  const btn = document.getElementById("retour-haut");
  const PLEINE_OPACITE_A = 900; // pixels de scroll
  let enAttente = false;

  function majOpacite() {
    const op = Math.min(window.scrollY / PLEINE_OPACITE_A, 1);
    btn.style.opacity = op.toFixed(3);
    btn.classList.toggle("actif", op > 0.12);
    enAttente = false;
  }

  window.addEventListener("scroll", () => {
    if (enAttente) return;
    enAttente = true;
    requestAnimationFrame(majOpacite);
  }, { passive: true });

  btn.addEventListener("click", () => {
    const sobre = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({ top: 0, behavior: sobre ? "auto" : "smooth" });
  });

  majOpacite();
}

rendre(EDITION);
animer();
bouton();
</script>

</body>
</html>
